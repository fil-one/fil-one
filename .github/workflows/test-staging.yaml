name: 'Tests [staging]'

on:
  workflow_call:

jobs:
  e2e:
    uses: ./.github/workflows/e2e-suites.yaml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      base_url: https://staging.fil.one
      failure_title: E2E tests failed after staging deploy
      failure_detail: "${{ format('Commit: `{0}` by <https://github.com/{1}|@{1}>', github.sha, github.actor) }}"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: integration-staging
      cancel-in-progress: false
      # Like the e2e job: the newest waiting run tests the latest deploy.
      queue: single
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      SST_STAGE: staging
      AWS_REGION: us-east-2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Run integration tests
        run: pnpm test:integration

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "filone-alerts",
              "text": ${{ toJSON(format('Integration tests failed after staging deploy. Commit: {0} by @{1}. Details: {2}/{3}/actions/runs/{4}', github.sha, github.actor, github.server_url, github.repository, github.run_id)) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':warning: *Integration tests failed after staging deploy* · <{0}/{1}/actions/runs/{2}|Details>', github.server_url, github.repository, github.run_id)) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('Commit: `{0}` by <https://github.com/{1}|@{1}>', github.sha, github.actor)) }}
                  }
                }
              ]
            }
