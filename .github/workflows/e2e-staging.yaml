name: 'E2E Tests [staging]'

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override BASE_URL (defaults to staging URL)'
        required: false
        type: string

jobs:
  # A concurrency group keeps one waiting job, and a newcomer cancels it.
  # A run of this workflow joining a suite's e2e-staging-<suite> group while
  # a post-deploy run waits would cancel that run and skip its production
  # deploy. This workflow therefore skips itself while a push to main has
  # reached deploy-staging and any of its test-staging e2e jobs has not
  # finished; those jobs run the same suites. A pipeline still in lint or unit tests does not
  # count, because it may fail before it tests staging. If the GitHub API
  # fails, the suite runs anyway.
  check-deploy-pipeline:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      busy: ${{ steps.check.outputs.busy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # A deploy-staging job appears only after the pre-deploy jobs pass.
          AWAITS_STAGING_E2E: >-
            .jobs
            | (map(select(.name == "deploy-staging")) | .[0]) as $deploy
            | map(select(.name | startswith("test-staging / e2e"))) as $e2e
            | $deploy != null
              and ($deploy.status != "completed" or $deploy.conclusion == "success")
              and ($e2e == [] or any($e2e[]; .status != "completed"))
        run: |
          busy=false
          if ! run_ids=$(gh api "repos/${{ github.repository }}/actions/workflows/packages-ci.yaml/runs?branch=main&event=push&per_page=20" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id'); then
            echo "::warning::Could not list deploy pipeline runs; running the suite anyway"
            run_ids=""
          fi
          for run_id in $run_ids; do
            if ! awaits=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs?per_page=100" --jq "$AWAITS_STAGING_E2E"); then
              echo "::warning::Could not read jobs of run $run_id; ignoring it"
              continue
            fi
            if [ "$awaits" = true ]; then
              busy=true
              echo "Skipping: deploy pipeline run ${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id will test staging" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "busy=$busy" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [check-deploy-pipeline]
    if: needs.check-deploy-pipeline.outputs.busy == 'false'
    uses: ./.github/workflows/e2e-suites.yaml
    permissions:
      id-token: write
      contents: read
    secrets:
      E2E_PAID_EMAIL: ${{ secrets.E2E_PAID_EMAIL }}
      E2E_PAID_PASSWORD: ${{ secrets.E2E_PAID_PASSWORD }}
      E2E_PAID_USER_ID: ${{ secrets.E2E_PAID_USER_ID }}
      E2E_UNPAID_EMAIL: ${{ secrets.E2E_UNPAID_EMAIL }}
      E2E_UNPAID_PASSWORD: ${{ secrets.E2E_UNPAID_PASSWORD }}
      E2E_UNPAID_USER_ID: ${{ secrets.E2E_UNPAID_USER_ID }}
      E2E_TRIAL_EMAIL: ${{ secrets.E2E_TRIAL_EMAIL }}
      E2E_TRIAL_PASSWORD: ${{ secrets.E2E_TRIAL_PASSWORD }}
      E2E_TRIAL_USER_ID: ${{ secrets.E2E_TRIAL_USER_ID }}
      E2E_DISABLED_EMAIL: ${{ secrets.E2E_DISABLED_EMAIL }}
      E2E_DISABLED_PASSWORD: ${{ secrets.E2E_DISABLED_PASSWORD }}
      E2E_DISABLED_USER_ID: ${{ secrets.E2E_DISABLED_USER_ID }}
      E2E_ORG_OWNER_EMAIL: ${{ secrets.E2E_ORG_OWNER_EMAIL }}
      E2E_ORG_OWNER_PASSWORD: ${{ secrets.E2E_ORG_OWNER_PASSWORD }}
      E2E_ORG_OWNER_AUTH0_ID: ${{ secrets.E2E_ORG_OWNER_AUTH0_ID }}
      E2E_ORG_MEMBER_EMAIL: ${{ secrets.E2E_ORG_MEMBER_EMAIL }}
      E2E_ORG_MEMBER_PASSWORD: ${{ secrets.E2E_ORG_MEMBER_PASSWORD }}
      E2E_ORG_MEMBER_AUTH0_ID: ${{ secrets.E2E_ORG_MEMBER_AUTH0_ID }}
      E2E_ORG_FRESH_EMAIL: ${{ secrets.E2E_ORG_FRESH_EMAIL }}
      E2E_ORG_FRESH_PASSWORD: ${{ secrets.E2E_ORG_FRESH_PASSWORD }}
      E2E_ORG_FRESH_AUTH0_ID: ${{ secrets.E2E_ORG_FRESH_AUTH0_ID }}
      E2E_POLICY_OWNER_EMAIL: ${{ secrets.E2E_POLICY_OWNER_EMAIL }}
      E2E_POLICY_OWNER_PASSWORD: ${{ secrets.E2E_POLICY_OWNER_PASSWORD }}
      E2E_POLICY_OWNER_USER_ID: ${{ secrets.E2E_POLICY_OWNER_USER_ID }}
      E2E_POLICY_ADMIN_EMAIL: ${{ secrets.E2E_POLICY_ADMIN_EMAIL }}
      E2E_POLICY_ADMIN_PASSWORD: ${{ secrets.E2E_POLICY_ADMIN_PASSWORD }}
      E2E_POLICY_ADMIN_USER_ID: ${{ secrets.E2E_POLICY_ADMIN_USER_ID }}
      E2E_POLICY_MEMBER_EMAIL: ${{ secrets.E2E_POLICY_MEMBER_EMAIL }}
      E2E_POLICY_MEMBER_PASSWORD: ${{ secrets.E2E_POLICY_MEMBER_PASSWORD }}
      E2E_POLICY_MEMBER_USER_ID: ${{ secrets.E2E_POLICY_MEMBER_USER_ID }}
      E2E_POLICY_READONLY_EMAIL: ${{ secrets.E2E_POLICY_READONLY_EMAIL }}
      E2E_POLICY_READONLY_PASSWORD: ${{ secrets.E2E_POLICY_READONLY_PASSWORD }}
      E2E_POLICY_READONLY_USER_ID: ${{ secrets.E2E_POLICY_READONLY_USER_ID }}
      E2E_POLICY_LEAVER_EMAIL: ${{ secrets.E2E_POLICY_LEAVER_EMAIL }}
      E2E_POLICY_LEAVER_PASSWORD: ${{ secrets.E2E_POLICY_LEAVER_PASSWORD }}
      E2E_POLICY_LEAVER_USER_ID: ${{ secrets.E2E_POLICY_LEAVER_USER_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      base_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || 'https://staging.fil.one' }}
      failure_title: E2E test run failed
      failure_detail: "${{ format('Deployment tested: `{0}`', github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || 'https://staging.fil.one') }}"

  dispatch-telemetry:
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch telemetry event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            --method POST \
            -f event_type=workflow-telemetry \
            -f "client_payload[run_id]=${{ github.run_id }}"
