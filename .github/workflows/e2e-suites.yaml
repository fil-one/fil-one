name: 'E2E Suites [staging]'

# The Playwright suites against staging, shared by the post-deploy run
# (test-staging.yaml) and the nightly run (e2e-staging.yaml).

on:
  workflow_call:
    inputs:
      base_url:
        description: 'The deployment under test'
        required: true
        type: string
      failure_title:
        description: 'Slack alert title; the suite name is appended'
        required: true
        type: string
      failure_detail:
        description: 'Slack alert context line (mrkdwn)'
        required: true
        type: string
    # Callers pass each secret by name rather than `secrets: inherit`, so
    # this workflow sees only the credentials the suites use.
    secrets:
      E2E_PAID_EMAIL:
        required: true
      E2E_PAID_PASSWORD:
        required: true
      E2E_PAID_USER_ID:
        required: true
      E2E_UNPAID_EMAIL:
        required: true
      E2E_UNPAID_PASSWORD:
        required: true
      E2E_UNPAID_USER_ID:
        required: true
      E2E_TRIAL_EMAIL:
        required: true
      E2E_TRIAL_PASSWORD:
        required: true
      E2E_TRIAL_USER_ID:
        required: true
      E2E_ORG_OWNER_EMAIL:
        required: true
      E2E_ORG_OWNER_PASSWORD:
        required: true
      E2E_ORG_OWNER_AUTH0_ID:
        required: true
      E2E_ORG_MEMBER_EMAIL:
        required: true
      E2E_ORG_MEMBER_PASSWORD:
        required: true
      E2E_ORG_MEMBER_AUTH0_ID:
        required: true
      E2E_ORG_FRESH_EMAIL:
        required: true
      E2E_ORG_FRESH_PASSWORD:
        required: true
      E2E_ORG_FRESH_AUTH0_ID:
        required: true
      E2E_POLICY_OWNER_EMAIL:
        required: true
      E2E_POLICY_OWNER_PASSWORD:
        required: true
      E2E_POLICY_OWNER_USER_ID:
        required: true
      E2E_POLICY_ADMIN_EMAIL:
        required: true
      E2E_POLICY_ADMIN_PASSWORD:
        required: true
      E2E_POLICY_ADMIN_USER_ID:
        required: true
      E2E_POLICY_MEMBER_EMAIL:
        required: true
      E2E_POLICY_MEMBER_PASSWORD:
        required: true
      E2E_POLICY_MEMBER_USER_ID:
        required: true
      E2E_POLICY_READONLY_EMAIL:
        required: true
      E2E_POLICY_READONLY_PASSWORD:
        required: true
      E2E_POLICY_READONLY_USER_ID:
        required: true
      E2E_POLICY_LEAVER_EMAIL:
        required: true
      E2E_POLICY_LEAVER_PASSWORD:
        required: true
      E2E_POLICY_LEAVER_USER_ID:
        required: true
      SLACK_BOT_TOKEN:
        required: true

jobs:
  suite:
    name: ${{ matrix.suite }}
    # One job per suite, each logging in as its own accounts, so the suites
    # run at once. Each suite runs every browser in one Playwright run, one
    # test at a time, because the browsers share the suite's accounts.
    # Projects are named `<suite>-<browser>` (playwright.config.ts).
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: destructive
            args: --project='destructive-*' --project=smoke-chromium
          - suite: multi-org
            args: --project='multi-org-*'
          - suite: policies
            args: --project='policies-*' --workers=2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A suite resets its accounts' BillingTable rows and org membership, so
    # two overlapping runs of it break each other: runs of a suite wait in
    # line, whichever workflow started them. A waiting run must not cancel a
    # running one, hence no cancel-in-progress.
    # A staging deploy (group deploy-staging in packages-ci.yaml) can still
    # land during a run. Deploys take about two minutes and are followed by
    # their own post-deploy run, so we accept the rare mixed-version failure.
    concurrency:
      group: e2e-staging-${{ matrix.suite }}
      cancel-in-progress: false
      # Keep only the newest waiting job: it tests the latest deploy, which
      # includes the earlier commits. queue: max would run every waiting job
      # in turn and delay the newest commit's production deploy.
      # e2e-staging.yaml skips itself while a post-deploy run may be waiting,
      # so a nightly run never cancels one.
      queue: single
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      SST_STAGE: staging
      AWS_REGION: us-east-2
      BASE_URL: ${{ inputs.base_url }}
      E2E_PAID_EMAIL: ${{ secrets.E2E_PAID_EMAIL }}
      E2E_PAID_PASSWORD: ${{ secrets.E2E_PAID_PASSWORD }}
      E2E_PAID_USER_ID: ${{ secrets.E2E_PAID_USER_ID }}
      E2E_UNPAID_EMAIL: ${{ secrets.E2E_UNPAID_EMAIL }}
      E2E_UNPAID_PASSWORD: ${{ secrets.E2E_UNPAID_PASSWORD }}
      E2E_UNPAID_USER_ID: ${{ secrets.E2E_UNPAID_USER_ID }}
      E2E_TRIAL_EMAIL: ${{ secrets.E2E_TRIAL_EMAIL }}
      E2E_TRIAL_PASSWORD: ${{ secrets.E2E_TRIAL_PASSWORD }}
      E2E_TRIAL_USER_ID: ${{ secrets.E2E_TRIAL_USER_ID }}
      E2E_ORG_OWNER_EMAIL: ${{ secrets.E2E_ORG_OWNER_EMAIL }}
      E2E_ORG_OWNER_PASSWORD: ${{ secrets.E2E_ORG_OWNER_PASSWORD }}
      E2E_ORG_OWNER_AUTH0_ID: ${{ secrets.E2E_ORG_OWNER_AUTH0_ID }}
      E2E_ORG_MEMBER_EMAIL: ${{ secrets.E2E_ORG_MEMBER_EMAIL }}
      E2E_ORG_MEMBER_PASSWORD: ${{ secrets.E2E_ORG_MEMBER_PASSWORD }}
      E2E_ORG_MEMBER_AUTH0_ID: ${{ secrets.E2E_ORG_MEMBER_AUTH0_ID }}
      E2E_ORG_FRESH_EMAIL: ${{ secrets.E2E_ORG_FRESH_EMAIL }}
      E2E_ORG_FRESH_PASSWORD: ${{ secrets.E2E_ORG_FRESH_PASSWORD }}
      E2E_ORG_FRESH_AUTH0_ID: ${{ secrets.E2E_ORG_FRESH_AUTH0_ID }}
      E2E_POLICY_OWNER_EMAIL: ${{ secrets.E2E_POLICY_OWNER_EMAIL }}
      E2E_POLICY_OWNER_PASSWORD: ${{ secrets.E2E_POLICY_OWNER_PASSWORD }}
      E2E_POLICY_OWNER_USER_ID: ${{ secrets.E2E_POLICY_OWNER_USER_ID }}
      E2E_POLICY_ADMIN_EMAIL: ${{ secrets.E2E_POLICY_ADMIN_EMAIL }}
      E2E_POLICY_ADMIN_PASSWORD: ${{ secrets.E2E_POLICY_ADMIN_PASSWORD }}
      E2E_POLICY_ADMIN_USER_ID: ${{ secrets.E2E_POLICY_ADMIN_USER_ID }}
      E2E_POLICY_MEMBER_EMAIL: ${{ secrets.E2E_POLICY_MEMBER_EMAIL }}
      E2E_POLICY_MEMBER_PASSWORD: ${{ secrets.E2E_POLICY_MEMBER_PASSWORD }}
      E2E_POLICY_MEMBER_USER_ID: ${{ secrets.E2E_POLICY_MEMBER_USER_ID }}
      E2E_POLICY_READONLY_EMAIL: ${{ secrets.E2E_POLICY_READONLY_EMAIL }}
      E2E_POLICY_READONLY_PASSWORD: ${{ secrets.E2E_POLICY_READONLY_PASSWORD }}
      E2E_POLICY_READONLY_USER_ID: ${{ secrets.E2E_POLICY_READONLY_USER_ID }}
      E2E_POLICY_LEAVER_EMAIL: ${{ secrets.E2E_POLICY_LEAVER_EMAIL }}
      E2E_POLICY_LEAVER_PASSWORD: ${{ secrets.E2E_POLICY_LEAVER_PASSWORD }}
      E2E_POLICY_LEAVER_USER_ID: ${{ secrets.E2E_POLICY_LEAVER_USER_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin the first pnpm/action-setup commit that declares a Node 24 runtime.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # auth.setup.ts re-seeds BillingTable rows for the test users via direct
      # DynamoDB writes (see tests/e2e/billing-reset.ts). The test:e2e script
      # wraps Playwright in `sst shell` so SST Resource bindings (BillingTable
      # name, etc.) resolve to the staging stage.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Run E2E tests
        run: pnpm test:e2e ${{ matrix.args }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-staging-${{ matrix.suite }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "filone-alerts",
              "text": ${{ toJSON(format('{0} ({1} suite). {2} Details: {3}/{4}/actions/runs/{5}', inputs.failure_title, matrix.suite, inputs.failure_detail, github.server_url, github.repository, github.run_id)) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':warning: *{0} ({1} suite)* · <{2}/{3}/actions/runs/{4}|Details>', inputs.failure_title, matrix.suite, github.server_url, github.repository, github.run_id)) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(inputs.failure_detail) }}
                  }
                }
              ]
            }
