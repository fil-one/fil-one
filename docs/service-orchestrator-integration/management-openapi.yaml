openapi: 3.1.0
info:
  title: FilOne Service Orchestrator Management API
  version: 0.1.0
  description: |
    Management API that a Service Orchestrator must implement so FilOne
    can integrate it as a new region. Covers tenant lifecycle, S3
    access-key management, usage metering (storage, egress, ingress),
    and, for orchestrators serving the `iam` access model, principals
    and bucket policies.

    ## Access models

    Every orchestrator serves the *scoped-keys* model: an access key
    carries its own permission set and optional bucket list, fixed at
    creation. An orchestrator may additionally serve the *iam* model,
    in which each FilOne member is a **principal**, each bucket holds at
    most one **bucket policy** naming principals and the S3 actions they
    may or may not perform, and an access key may be **bound to a
    principal**, in which case it carries no permissions of its own and
    is authorized on every request from the bucket policies. The
    principal and bucket-policy endpoints below are the `iam` capability
    set; an orchestrator that serves only scoped keys may answer them
    with 404.

    The Service Orchestrator must also operate an S3 Gateway for
    bucket and object operations; that surface is outside this
    contract.

    ## Authentication

    A single **partner key** authenticates every endpoint. It is a
    global, partner-scoped admin credential, sent as a bearer token in
    the standard `Authorization: Bearer <token>` header. The Service
    Orchestrator must scope this credential so it cannot reach tenants
    belonging to other partners.

    ## Idempotency

    Every operation is safely retryable end-to-end:

      * `PUT /tenants/{tenantId}` returns the existing tenant when
        called with a `tenantId` that already exists.
      * `POST /tenants/{tenantId}/status` is a no-op when the tenant is
        already in the requested status.
      * `DELETE /tenants/{tenantId}` returns 204 even if the tenant is
        already gone.
      * `POST /tenants/{tenantId}/access-keys` returns 409 on duplicate
        `name`; the caller can recover via list + get.
      * `DELETE /tenants/{tenantId}/access-keys/{accessKeyId}` returns 204
        even if the key was already deleted.
      * `PUT /tenants/{tenantId}/principals/{principalId}` returns 200 when
        the principal exists, and `DELETE` returns 204 when it is already
        gone.
      * Bucket policy writes carry a precondition (`If-Match` or
        `If-None-Match: *`), so a retry of a write that already landed
        answers 412 and writes nothing.

servers:
  - url: https://api.example.com/
    description: Service Orchestrator management API endpoint.

security:
  - PartnerKey: []

tags:
  - name: Tenants
    description: Tenant lifecycle and information.
  - name: Access Keys
    description: S3 access-key CRUD scoped to a single tenant.
  - name: Metrics
    description: Usage metering for storage, egress, and ingress.
  - name: Principals
    description: FilOne members as the orchestrator knows them (`iam` access model).
  - name: Bucket Policies
    description: One policy per bucket naming principals and actions (`iam` access model).

paths:
  /tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      tags: [Tenants]
      summary: Create and set up a tenant
      description: |
        Provisions a tenant and runs all setup steps synchronously. The
        response is returned only after the tenant is fully operational —
        the S3 gateway accepts traffic and access-key issuance is
        available.

        Idempotent on `tenantId`: a second call with the same identifier
        returns the existing tenant rather than failing. The `tenantId`
        is supplied by FilOne (a UUID) in the URL path and reused as the
        `{tenantId}` path parameter in all subsequent calls.
      security:
        - PartnerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '200':
          description: Tenant already existed (idempotent re-call).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '201':
          description: Tenant created and set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/Internal'
    get:
      tags: [Tenants]
      summary: Get tenant info
      description: |
        Returns the operational state of the tenant: status, resource
        counts, and resource limits. Used by FilOne to render the
        dashboard quotas display and to read current status before
        deciding whether a status update is necessary.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: Tenant info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tenants]
      summary: Delete a tenant
      description: |
        Permanently deletes the tenant and all resources owned by it
        (buckets, objects, S3 access keys). The operation is
        irreversible.

        The tenant must be in the `disabled` state before deletion. The
        caller is expected to first cut off all access via
        `POST /tenants/{tenantId}/status` with `status: disabled`, then
        invoke this endpoint to commit the deletion. Calls against a
        tenant in any other status return 409.

        Synchronous: the response is returned only after every owned
        resource has been removed. Idempotent: a call against a tenant
        that is already gone returns 204.

        If cleanup of one or more owned resources fails partway through,
        the Service Orchestrator must return 5xx and the tenant must
        remain deletable on retry — there must be no half-deleted,
        undeletable state.
      security:
        - PartnerKey: []
      responses:
        '204':
          description: Tenant deleted (or already deleted).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Tenant is not in the `disabled` state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /tenants/{tenantId}/status:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Tenants]
      summary: Set tenant status
      description: |
        Sets the operational status of the tenant. The Service Orchestrator's S3
        gateway must enforce these states:

          * `active` — read/write access.
          * `write-locked` — read-only; uploads and bucket creation
            blocked, but reads, listings, and deletes succeed.
          * `disabled` — all access blocked. Data is persisted and
            recoverable by transitioning back to `active`.

        Setting the same status twice is a no-op (still returns 204).
      security:
        - PartnerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantStatusRequest'
      responses:
        '204':
          description: Status updated (or unchanged).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tenants/{tenantId}/access-keys:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Access Keys]
      summary: Create an S3 access key
      description: |
        Provisions an AWS Sig V4 access-key pair. The `secretAccessKey`
        is returned only in this response.

        The body takes one of two shapes, and the shape decides the kind
        of key:

          * `{ name, permissions, buckets?, expiresAt? }` — a **service
            key**, authorized from the permissions and buckets it was
            created with.
          * `{ name, principalId, expiresAt? }` — a **principal-bound
            key** (`iam` access model), authorized on every request from
            the bucket policies naming that principal. The orchestrator
            must reject (422) a body carrying `principalId` together with
            `permissions` or `buckets`, and a `principalId` that is not a
            live principal of the tenant.

        A service key's name is unique within the tenant; a
        principal-bound key's name is unique within its principal.
      security:
        - PartnerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessKeyRequest'
      responses:
        '201':
          description: Access key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccessKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An access key with this `name` already exists for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Access Keys]
      summary: List S3 access keys
      security:
        - PartnerKey: []
      responses:
        '200':
          description: List of access keys (without secrets).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenantId}/access-keys/{accessKeyId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/AccessKeyId'
    get:
      tags: [Access Keys]
      summary: Get an S3 access key
      description: Returns the access key's metadata. The secret is never returned by this endpoint.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: Access key details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Access Keys]
      summary: Delete an S3 access key
      description: |
        Revokes the access key immediately. Subsequent S3 requests
        signed with these credentials must fail. Returns 204 even if
        the key was already deleted. Returns 404 if the tenant does
        not exist.
      security:
        - PartnerKey: []
      responses:
        '204':
          description: Deleted (or already deleted).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenantId}/principals:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Principals]
      summary: List principals
      security:
        - PartnerKey: []
      responses:
        '200':
          description: The tenant's live principals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenantId}/principals/{principalId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PrincipalId'
    put:
      tags: [Principals]
      summary: Create a principal
      description: |
        Creates the principal, or answers 200 when it already exists.
        Idempotent. A principal carries no permissions, no role, and no
        key material: it is the identity a key can bind to and a policy
        statement can name. Creating one after it was removed revives
        the id with no keys and named in no statement.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: The principal already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '201':
          description: Principal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConcurrentChange'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Principals]
      summary: Get a principal
      security:
        - PartnerKey: []
      responses:
        '200':
          description: Principal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Principals]
      summary: Remove a principal
      description: |
        Removes the principal, deletes every access key bound to it, and
        strips it from every bucket policy statement naming it. A
        statement left with no principal is dropped, and a policy left
        with no statement is deleted. Answers 204 for a principal that is
        already gone or never existed.
      security:
        - PartnerKey: []
      responses:
        '204':
          description: Removed (or already absent).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConcurrentChange'

  /tenants/{tenantId}/principals/{principalId}/access-keys:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PrincipalId'
    get:
      tags: [Principals]
      summary: List a principal's access keys
      security:
        - PartnerKey: []
      responses:
        '200':
          description: The keys bound to this principal (without secrets).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenantId}/principals/{principalId}/policies:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PrincipalId'
    get:
      tags: [Principals]
      summary: Bucket policies naming a principal
      description: Every bucket policy with a statement naming the principal or `*`.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: The policies, each with its bucket and current ETag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPolicies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenantId}/principals/{principalId}/access:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PrincipalId'
    get:
      tags: [Principals]
      summary: A principal's effective actions per bucket
      description: |
        For every bucket whose policy gives the principal at least one
        action, the sorted effective set: the union of the `allow`
        statements naming them or `*`, minus the union of the `deny`
        statements naming them or `*`. Buckets with an empty set are
        omitted. Computed from the orchestrator's own tables on every
        call, so the answer is consistent with its last write.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: The principal's reach.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenantId}/buckets/{bucketName}/policy:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BucketName'
    get:
      tags: [Bucket Policies]
      summary: Read a bucket's policy
      description: |
        Returns the stored document and, in the `ETag` header, a strong
        validator over its canonical encoding. Callers treat the ETag as
        opaque and send it back on the next write.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: The policy.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PolicyOrBucketNotFound'
    put:
      tags: [Bucket Policies]
      summary: Create or replace a bucket's policy
      description: |
        Compare-and-set. The request carries exactly one precondition:
        `If-Match` with the ETag the last read returned, or
        `If-None-Match: *` to create the bucket's first policy. A request
        with neither, with both, or with another `If-None-Match` value is
        400. A mismatch, or `If-None-Match: *` when a policy exists, is
        412 and nothing is written.

        The orchestrator validates the document: every action in the
        policy vocabulary or `s3:*`; every principal `*` or a live
        principal of the tenant; no empty statement or action list; no
        field outside the schema. A failing document is 422.

        Before acknowledging, the orchestrator invalidates the cached
        authority of every key bound to a principal whose effective
        actions changed, so the write is visible at the S3 gateway
        within its propagation bound.
      security:
        - PartnerKey: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketPolicy'
      responses:
        '200':
          description: Policy replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '201':
          description: Policy created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConcurrentChange'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Bucket Policies]
      summary: Delete a bucket's policy
      description: |
        Carries `If-Match` with the ETag the last read returned; a
        mismatch is 412 and nothing is written. A bucket with no policy
        is 404 with a `PolicyNotFound` code.
      security:
        - PartnerKey: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Policy deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PolicyOrBucketNotFound'
        '409':
          $ref: '#/components/responses/ConcurrentChange'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /tenants/{tenantId}/metrics:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MetricsFrom'
      - $ref: '#/components/parameters/MetricsTo'
      - $ref: '#/components/parameters/MetricsWindow'
    get:
      tags: [Metrics]
      summary: Tenant usage time series
      description: |
        Returns time-bucketed samples of storage, egress, and ingress
        for the tenant. All three metric types share the same `from` /
        `to` / `window` parameters and are returned in a single
        response.

        Typical FilOne queries:

          * `window=1h` over the current billing period — used to
            compute average GB-hours for billing aggregation.
          * `window=24h` over the last 7 or 30 days — used for the
            dashboard trend chart.
          * `window=720h` (30 days) with a single sample — used for the
            dashboard usage snapshot.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: Usage samples for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenantId}/buckets/{bucketName}/metrics:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BucketName'
      - $ref: '#/components/parameters/MetricsFrom'
      - $ref: '#/components/parameters/MetricsTo'
      - $ref: '#/components/parameters/MetricsWindow'
    get:
      tags: [Metrics]
      summary: Per-bucket usage time series
      description: |
        Same shape as the tenant-level metrics, but scoped to a single
        bucket. The Service Orchestrator must verify that the bucket
        belongs to the path `tenantId` and return 404 otherwise.
      security:
        - PartnerKey: []
      responses:
        '200':
          description: Usage samples for the bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    PartnerKey:
      type: http
      scheme: bearer
      description: |
        Global partner-scoped admin key, sent as `Authorization: Bearer
        <token>`. Grants access across all tenants owned by this
        partner. The Service Orchestrator must scope this credential so it cannot reach
        tenants belonging to other partners.

  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    AccessKeyId:
      in: path
      name: accessKeyId
      required: true
      description: AWS-style access key ID (the value used by S3 clients).
      schema:
        type: string
    BucketName:
      in: path
      name: bucketName
      required: true
      schema:
        $ref: '#/components/schemas/BucketName'
    PrincipalId:
      in: path
      name: principalId
      required: true
      schema:
        $ref: '#/components/schemas/PrincipalId'
    IfMatch:
      in: header
      name: If-Match
      required: false
      description: |
        The ETag the last read of the policy returned. Required unless
        `If-None-Match: *` is sent.
      schema:
        type: string
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: The literal `*`, to create the bucket's first policy. Any other value is 400.
      schema:
        type: string
        enum: ['*']
    MetricsFrom:
      in: query
      name: from
      required: true
      description: |
        Start of the query range (inclusive), RFC 3339. Service Orchestrators
        must support ranges (`to` − `from`) of at least 32 days.
      schema:
        type: string
        format: date-time
    MetricsTo:
      in: query
      name: to
      required: true
      description: End of the query range (exclusive), RFC 3339.
      schema:
        type: string
        format: date-time
    MetricsWindow:
      in: query
      name: window
      required: true
      description: |
        Sample bucket size, expressed as `<integer>h`. Service Orchestrators
        must support `1h`, `24h`, and `720h` (30 days) at minimum, and must
        be able to return at least 768 samples per response (covers a 32-day
        range at 1 h granularity — the most demanding query FilOne issues).
      schema:
        type: string
        pattern: '^[0-9]+h$'

  headers:
    ETag:
      required: true
      description: Strong validator over the stored policy's canonical encoding. Opaque to callers.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Malformed request — invalid query parameter, path parameter, or
        unparseable JSON body. Body validation errors return 422 instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Request body is well-formed but fails semantic validation
        (missing required field, value out of range, enum mismatch,
        cross-field constraint, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token, or token not authorised for this tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConcurrentChange:
      description: |
        The write could not take its lock within the orchestrator's
        timeout, because another change to the same principal or policy
        is in flight. Nothing was written; the caller retries.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: |
        The ETag did not match the stored policy, or `If-None-Match: *`
        was sent and a policy exists. Nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PolicyOrBucketNotFound:
      description: |
        The bucket does not exist or belongs to another tenant, or the
        bucket exists and has no policy. The body's `code` is
        `PolicyNotFound` in the second case, so callers can tell the two
        apart.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    TenantId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: |
        Client-supplied tenant identifier. Must be a UUID and must be
        unique within the partner. Used as the canonical ID in all
        calls (`{tenantId}` path parameter). FilOne supplies this value
        at tenant creation time via `PUT /tenants/{tenantId}`; the same
        value is the idempotency key for that operation.

    BucketName:
      type: string
      minLength: 3
      maxLength: 63
      description: |
        S3 bucket name. Length bounds match the S3 bucket-naming rules.

    TenantStatus:
      type: string
      enum: [active, write-locked, disabled]
      description: |
        * `active` — read/write
        * `write-locked` — read-only; uploads and bucket creation blocked
        * `disabled` — all access blocked, data persisted

    CreateTenantRequest:
      type: object
      required: [region]
      properties:
        region:
          type: string
          minLength: 1
          description: |
            Region identifier the tenant's data is provisioned in — the
            same region name used in the S3 Gateway hostname
            (`https://s3.{region}.filonecontent.com`), e.g. `us-east-1`. A Service
            Orchestrator may manage more than one region; it must reject
            (422) region values it does not serve.

    Tenant:
      type: object
      required:
        [tenantId, status, bucketCount, bucketLimit, accessKeyCount, accessKeyLimit, createdAt]
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        status:
          $ref: '#/components/schemas/TenantStatus'
        bucketCount:
          type: integer
          minimum: 0
        bucketLimit:
          type: integer
          minimum: 0
          description: Maximum number of buckets the tenant may create.
        accessKeyCount:
          type: integer
          minimum: 0
          description: |
            Total number of S3 access keys for this tenant, including a
            per-tenant system key issued by FilOne for Console use. The
            Service Orchestrator does not need to treat the system key
            specially; it is counted alongside user-created keys.
        accessKeyLimit:
          type: integer
          minimum: 0
          description: Maximum number of S3 access keys the tenant may hold.
        createdAt:
          type: string
          format: date-time

    UpdateTenantStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TenantStatus'

    AccessKeyPermission:
      type: string
      enum:
        - s3:CreateBucket
        - s3:ListAllMyBuckets
        - s3:DeleteBucket
        - s3:GetObject
        - s3:GetObjectVersion
        - s3:GetObjectRetention
        - s3:GetObjectLegalHold
        - s3:PutObject
        - s3:PutObjectRetention
        - s3:PutObjectLegalHold
        - s3:ListBucket
        - s3:ListBucketVersions
        - s3:ListBucketMultipartUploads
        - s3:ListMultipartUploadParts
        - s3:AbortMultipartUpload
        - s3:DeleteObject
        - s3:DeleteObjectVersion
      description: |
        Permission scope expressed as an AWS S3 IAM action.

        **Bucket-level** — operating on buckets via the S3 Gateway:

          * `s3:CreateBucket` — create a bucket.
          * `s3:ListAllMyBuckets` — list the tenant's buckets.
          * `s3:DeleteBucket` — delete a bucket.

        **Object-level** — operating on objects within buckets. The
        basic actions (`s3:GetObject`, `s3:PutObject`, `s3:ListBucket`,
        `s3:DeleteObject`) cover the common case; the variant actions
        opt in to operations on object versions, retention policies, and
        legal holds.

          * `s3:GetObject` — get an object and its metadata.
          * `s3:GetObjectVersion` — get a specific object version.
          * `s3:GetObjectRetention` — read an object's retention policy.
          * `s3:GetObjectLegalHold` — read an object's legal-hold status.
          * `s3:PutObject` — upload or overwrite an object.
          * `s3:PutObjectRetention` — set or modify an object's retention policy.
          * `s3:PutObjectLegalHold` — apply or remove an object's legal hold.
          * `s3:ListBucket` — list objects in a bucket. (AWS quirk: this
            action lists *objects*, not buckets — `s3:ListAllMyBuckets`
            is the action that lists buckets.)
          * `s3:ListBucketVersions` — list object versions in a bucket.
            (Same AWS quirk as `s3:ListBucket` above: the name says
            "Bucket" but the action operates on object versions.)
          * `s3:ListBucketMultipartUploads` — list in-progress multipart
            uploads in a bucket. (Same AWS quirk as `s3:ListBucket`
            above: the name says "Bucket" but the action operates on
            uploads within it.)
          * `s3:ListMultipartUploadParts` — list the parts of an
            in-progress multipart upload.
          * `s3:AbortMultipartUpload` — abort an in-progress multipart
            upload.
          * `s3:DeleteObject` — delete an object.
          * `s3:DeleteObjectVersion` — delete a specific object version.

    PrincipalId:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        Caller-supplied, opaque, unique within the tenant. FilOne uses
        its member user id. The value `*` is reserved for the policy
        wildcard and must be rejected (422).

    Principal:
      type: object
      required: [principalId, createdAt]
      properties:
        principalId:
          $ref: '#/components/schemas/PrincipalId'
        createdAt:
          type: string
          format: date-time

    PrincipalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Principal'

    PolicyAction:
      type: string
      enum:
        - s3:GetObject
        - s3:GetObjectVersion
        - s3:GetObjectRetention
        - s3:GetObjectLegalHold
        - s3:ListBucket
        - s3:ListBucketVersions
        - s3:ListBucketMultipartUploads
        - s3:ListMultipartUploadParts
        - s3:PutObject
        - s3:AbortMultipartUpload
        - s3:PutObjectRetention
        - s3:PutObjectLegalHold
        - s3:DeleteObject
        - s3:DeleteObjectVersion
        - 's3:*'
      description: |
        An action a bucket policy statement may carry: every
        `AccessKeyPermission` except the three bucket-level actions
        (`s3:CreateBucket`, `s3:DeleteBucket`, `s3:ListAllMyBuckets`),
        plus `s3:*`, which stands for all of the others and never for
        those three.

    PolicyStatement:
      type: object
      required: [effect, principal, action]
      additionalProperties: false
      properties:
        sid:
          type: string
          description: Optional label. Stored and returned; nothing evaluates it.
        effect:
          type: string
          enum: [allow, deny]
        principal:
          description: |
            The principals the statement applies to: a list of principal
            ids, or the bare string `*` for every live principal of the
            tenant. `*` inside a list is rejected (422).
          oneOf:
            - type: string
              enum: ['*']
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PrincipalId'
        action:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PolicyAction'

    BucketPolicy:
      type: object
      required: [statement]
      additionalProperties: false
      description: |
        A bucket's policy, reduced to what the orchestrator evaluates.
        There is no `resource` field: the document governs the bucket it
        is stored on. A principal's effective actions are the union of
        the `allow` statements naming them minus the union of the `deny`
        statements naming them; an explicit deny wins.
      properties:
        statement:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PolicyStatement'

    PrincipalPolicies:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [bucketName, etag, policy]
            properties:
              bucketName:
                $ref: '#/components/schemas/BucketName'
              etag:
                type: string
              policy:
                $ref: '#/components/schemas/BucketPolicy'

    PrincipalAccess:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            type: object
            required: [name, actions]
            properties:
              name:
                $ref: '#/components/schemas/BucketName'
              actions:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyAction'

    CreateAccessKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the tenant for a service key; unique within the principal for a principal-bound key.
        principalId:
          $ref: '#/components/schemas/PrincipalId'
        permissions:
          type: array
          minItems: 1
          description: Required for a service key. Must be absent when `principalId` is set.
          items:
            $ref: '#/components/schemas/AccessKeyPermission'
        buckets:
          type: array
          description: |
            Optional. When set and non-empty, the key may only operate on
            these buckets. Omit (or pass an empty array) for tenant-wide
            access. Must be absent when `principalId` is set.
          items:
            $ref: '#/components/schemas/BucketName'
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            Optional expiration. The Service Orchestrator must reject the credentials
            after this time.

    AccessKey:
      type: object
      required: [accessKeyId, name, createdAt]
      properties:
        accessKeyId:
          type: string
          description: AWS-style access key ID, used by S3 clients.
        name:
          type: string
        principal:
          description: Set on a principal-bound key. Such a key carries no `permissions` or `buckets`.
          allOf:
            - $ref: '#/components/schemas/PrincipalId'
        permissions:
          type: array
          description: Present on a service key, absent on a principal-bound key.
          items:
            $ref: '#/components/schemas/AccessKeyPermission'
        buckets:
          type: array
          description: Empty or omitted when the key has tenant-wide access.
          items:
            $ref: '#/components/schemas/BucketName'
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreatedAccessKey:
      allOf:
        - $ref: '#/components/schemas/AccessKey'
        - type: object
          required: [secretAccessKey]
          properties:
            secretAccessKey:
              type: string
              description: |
                AWS-style secret. Returned only on creation; the Service Orchestrator
                must not expose it via subsequent reads.

    AccessKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessKey'

    StorageSample:
      type: object
      required: [timestamp, bytesUsed, objectCount]
      properties:
        timestamp:
          type: string
          format: date-time
          description: End of the sample window (RFC 3339).
        bytesUsed:
          type: integer
          format: int64
          minimum: 0
        objectCount:
          type: integer
          format: int64
          minimum: 0

    EgressSample:
      type: object
      required: [timestamp, bytesEgressed]
      properties:
        timestamp:
          type: string
          format: date-time
          description: End of the sample window (RFC 3339).
        bytesEgressed:
          type: integer
          format: int64
          minimum: 0

    StorageMetrics:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/StorageSample'

    EgressMetrics:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/EgressSample'

    IngressSample:
      type: object
      required: [timestamp, bytesIngested]
      properties:
        timestamp:
          type: string
          format: date-time
          description: End of the sample window (RFC 3339).
        bytesIngested:
          type: integer
          format: int64
          minimum: 0

    IngressMetrics:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/IngressSample'

    Metrics:
      type: object
      required: [storage, egress, ingress]
      properties:
        storage:
          $ref: '#/components/schemas/StorageMetrics'
        egress:
          $ref: '#/components/schemas/EgressMetrics'
        ingress:
          $ref: '#/components/schemas/IngressMetrics'

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error description.
        code:
          type: string
          description: Machine-readable error code (optional).
